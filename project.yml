name: Heed
options:
  bundleIdPrefix: com.harishv27
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
packages:
  HeedCore:
    path: Packages/HeedCore
targets:
  Heed:
    type: application
    platform: iOS
    sources:
      - path: Heed
        excludes:
          - Info.plist
      - path: Shared
    dependencies:
      - package: HeedCore
      - target: HeedWidget
    entitlements:
      path: Heed/Heed.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.harishv27.heed
        # iCloud sync is off by default because it needs a paid developer account. To switch it on, add these keys,
        # add HEED_ICLOUD to SWIFT_ACTIVE_COMPILATION_CONDITIONS below, and see "iCloud sync" in the README.
        #   com.apple.developer.icloud-container-identifiers: [iCloud.com.harishv27.heed]
        #   com.apple.developer.icloud-services: [CloudKit]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.harishv27.heed
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_FILE: Heed/Info.plist
        ENABLE_PREVIEWS: YES
        # SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) HEED_ICLOUD
    info:
      path: Heed/Info.plist
      properties:
        CFBundleDisplayName: Heed
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations: {}
        # The "heed://add" link opens the quick-add sheet (used by the widget's + button).
        CFBundleURLTypes:
          - CFBundleURLName: com.harishv27.heed
            CFBundleURLSchemes:
              - heed
        # Automatic backups live in Documents/Backups, which shows up in the Files app under "On My iPhone > Heed".
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
  HeedWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: HeedWidget
        excludes:
          - Info.plist
      - path: Shared
    dependencies:
      - package: HeedCore
    entitlements:
      path: HeedWidget/HeedWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.harishv27.heed
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.harishv27.heed.widget
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: HeedWidget/Info.plist
        SKIP_INSTALL: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: HeedWidget/Info.plist
      properties:
        CFBundleDisplayName: Heed
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
schemes:
  Heed:
    build:
      targets:
        Heed: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: HeedCore/HeedCoreTests
    archive:
      config: Release
